<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayDOD - QR Generator</title>
    <!-- ربط ملف التصميم -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <span class="pay">Pay</span><span class="d1">D</span><span class="od">OD</span>
        </div>
        <input type="number" id="orderNumber" placeholder="أدخل رقم العملية">
        <button onclick="generateQR()">توليد QR Code</button>
        <div id="qr-result">
            <span style="color: #555;">سيظهر الكود هنا</span>
        </div>
    </div>

    <!-- ربط ملف المنطق -->
    <script src="script.js"></script>
</body>
</html>
