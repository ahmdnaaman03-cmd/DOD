<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أمان المندوب</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        #qrcode { margin: 20px auto; display: flex; justify-content: center; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>تحصيل شحنة (أمان المندوب)</h2>
        <input type="text" id="orderId" placeholder="أدخل رقم الطلب">
        <button onclick="getShipment()">توليد QR الدفع</button>
        <div id="result" class="hidden">
            <p><strong>العميل:</strong> <span id="cName"></span></p>
            <p><strong>المبلغ:</strong> <span id="cAmount"></span></p>
            <div id="qrcode"></div>
            <button id="payBtn" onclick="payOrder()" style="background: #007bff;">تأكيد الدفع</button>
        </div>
    <script>
        let currentOrderId = null; let currentAmount = 0;
        async function getShipment() {
            let id = document.getElementById('orderId').value.trim();
            if(!id) return alert('أدخل رقم الطلب');
            let res = await fetch(`/api/get-shipment?id=${id}`);
            let data = await res.json();
            if(data.success) {
                currentOrderId = data.shopify_order_id; currentAmount = data.amount;
                document.getElementById('cName').innerText = data.customer_name;
                document.getElementById('cAmount').innerText = data.amount;
                document.getElementById('qrcode').innerHTML = "";
                let qr = qrcode(0, 'L'); qr.addData(`AmanPay:${currentOrderId}`); qr.make();
                document.getElementById('qrcode').innerHTML = qr.createImgTag(5);
                document.getElementById('result').classList.remove('hidden');
            } else { alert(data.message); }
        }
        async function payOrder() {
            let res = await fetch('/api/pay', { method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ shopify_order_id: currentOrderId, amount: currentAmount }) });
            let data = await res.json();
            if(data.success) { alert('تم الدفع بنجاح!'); location.reload(); } else { alert('فشل: ' + data.message); }
        }
    </script>
</body>
</html>
