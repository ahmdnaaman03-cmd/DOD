<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayDoD</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; text-align: center; }
        .box { max-width: 380px; margin: 40px auto; background: #1e293b; padding: 20px; border-radius: 12px; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; border-radius: 8px; border: none; box-sizing: border-box; }
        input { background: #0f172a; color: #fff; border: 1px solid #475569; text-align: center; }
        .btn-p { background: #38bdf8; color: #0f172a; font-weight: bold; }
        .btn-s { background: #22c55e; color: #fff; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>PayDoD 🚀</h2>
        <input type="text" id="orderId" placeholder="رقم الشحنة (مثال: 1012)">
        <button class="btn-p" onclick="getShipment()">توليد QR</button>
        <div id="res" class="hidden">
            <p>العميل: <span id="cName"></span></p>
            <p>المبلغ: <span id="cAmount"></span> ج.م</p>
            <div id="qrcode" style="background:#fff; padding:10px; border-radius:8px; margin:15px 0;"></div>
            <button class="btn-s" onclick="payOrder()">تأكيد الدفع</button>
        </div>
    <script>
        let oId = null, oAmt = 0;
        async function getShipment() {
            let id = document.getElementById('orderId').value.trim();
            if(!id) return alert('أدخل الرقم');
            let res = await fetch(`/api/get-shipment?id=${id}`);
            let d = await res.json();
            if(d.success) {
                oId = d.shopify_order_id; oAmt = d.amount;
                document.getElementById('cName').innerText = d.customer_name;
                document.getElementById('cAmount').innerText = d.amount;
                document.getElementById('qrcode').innerHTML = "";
                let qr = qrcode(0, 'L'); qr.addData(`PayDoD:${oId}:${oAmt}`); qr.make();
                document.getElementById('qrcode').innerHTML = qr.createImgTag(5);
                document.getElementById('res').classList.remove('hidden');
            } else { alert(d.message || 'خطأ'); }
        }
        async function payOrder() {
            let res = await fetch('/api/pay', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ shopify_order_id: oId, amount: oAmt })
            });
            let d = await res.json();
            if(d.success) { alert('تم الدفع بنجاح!'); location.reload(); }
            else { alert('فشل: ' + d.message); }
        }
    </script>
</body>
</html>
