<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D.O.D - Digital-on-Delivery</title>
    <style>
        body { background: #111827; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1f2937; padding: 25px; border-radius: 16px; width: 90%; max-width: 420px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #6366f1; margin: 0 0 5px 0; font-size: 38px; font-weight: 900; letter-spacing: 2px; width: 100%; display: block; }
        p.sub { color: #9ca3af; font-size: 13px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #374151; background: #111827; color: #fff; text-align: center; font-size: 16px; box-sizing: border-box; margin-bottom: 12px; }
        button.btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #4f46e5; color: #fff; font-weight: bold; font-size: 15px; cursor: pointer; }
        #box { display: none; margin-top: 20px; }
        .amt { font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        .badge { margin-top: 15px; padding: 10px; border-radius: 8px; background: #374151; color: #fbbf24; font-size: 14px; }
        .btn-next { margin-top: 15px; width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #10b981; background: transparent; color: #10b981; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>D.O.D</h1>
        <p class="sub">Digital-on-Delivery Payment</p>
        <input type="text" id="orderId" placeholder="أدخل رقم الطلب...">
        <button class="btn" onclick="run()">توليد كود الدفع (QR Code)</button>

        <div id="box">
            <div class="amt">المبلغ المطلوب: <span id="val">0</span> ج.م</div>
            <img id="qr" src="" style="width:180px; height:180px; border-radius:8px;">
            <div id="st" class="badge">في انتظار دفع العميل...</div>
            <button class="btn-next" onclick="cls()">طلب جديد (Next Order)</button>
        </div>
    </div>

    <script>
        function run() {
            let id = document.getElementById('orderId').value;
            if(!id) return;
            fetch('/api/get-order', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({order_id: id})
            })
            .then(r => r.json())
            .then(d => {
                document.getElementById('val').innerText = d.amount;
                document.getElementById('qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=PAY_${id}_${d.amount}`;
                document.getElementById('box').style.display = 'block';
                setTimeout(() => {
                    fetch('/api/confirm-payment', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({order_id: id, amount: d.amount})
                    }).then(() => {
                        let s = document.getElementById('st');
                        s.innerText = '✓ تم الدفع بنجاح (PAYMENT SUCCESSFUL)';
                        s.style.background = '#065f46';
                        s.style.color = '#34d399';
                    });
                }, 3000);
            });
        }
        function cls() {
            document.getElementById('orderId').value = '';
            document.getElementById('box').style.display = 'none';
            let s = document.getElementById('st');
            s.innerText = 'في انتظار دفع العميل...';
            s.style.background = '#374151';
            s.style.color = '#fbbf24';
        }
    </script>
</body>
</html>
