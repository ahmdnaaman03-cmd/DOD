<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOD Terminal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000000; color: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        .phone-frame { width: 340px; height: 640px; background: #000000; border: 2px solid #1a1a1a; border-radius: 48px; padding: 35px 24px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.9); }
        .dod-title { font-size: 32px; font-weight: 900; color: #ffffff; margin-top: 5px; letter-spacing: 3px; }
        .input-box { width: 100%; margin: 15px 0; text-align: center; }
        .order-input { width: 85%; padding: 14px; border-radius: 12px; border: 1px solid #333333; background: #111111; color: #ffffff; font-size: 20px; font-weight: 700; text-align: center; outline: none; }
        .order-input:focus { border-color: #ff2d55; }
        .action-area { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; width: 100%; }
        .btn-red-circle { width: 130px; height: 130px; border-radius: 50%; background: #ff2d55; color: #ffffff; border: none; font-size: 14px; font-weight: 900; letter-spacing: 1.5px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-transform: uppercase; box-shadow: 0 0 35px rgba(255, 45, 85, 0.4); transition: transform 0.25s; }
        .btn-red-circle:active { transform: scale(0.92); }
        #qr-container { display: none; background: #ffffff; padding: 16px; border-radius: 20px; box-shadow: 0 10px 30px rgba(255,255,255,0.1); }
        #qr-code { display: flex; justify-content: center; }
        .status-area { margin-bottom: 5px; text-align: center; }
        .status-text { font-size: 12px; color: #666666; font-weight: 700; letter-spacing: 1px; }
        .status-paid { color: #34c759 !important; font-weight: 800; font-size: 14px; }
        .btn-reset { display: none; margin-top: 10px; background: transparent; color: #888888; border: 1px solid #333333; padding: 8px 18px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="dod-title">DOD</div>
        <div class="input-box" id="input-container">
            <input type="number" pattern="[0-9]*" id="order-id-input" class="order-input" value="9082" placeholder="ENTER ORDER #">
        </div>
        <div class="action-area">
            <button class="btn-red-circle" id="pay-btn" onclick="generateQR()">GENERATE</button>
            <div id="qr-container">
                <div id="qr-code"></div>
            </div>
        </div>
        <div class="status-area">
            <div id="status" class="status-text">ENTER ORDER # & GENERATE</div>
            <button id="reset-btn" class="btn-reset" onclick="resetTerminal()">NEXT ORDER</button>
        </div>
    </div>

    <script>
        let currentOrderId = "";
        let trackingInterval = null;

        function generateQR() {
            const inputVal = document.getElementById('order-id-input').value.trim();
            if(!inputVal) return alert("Please enter Order Number!");

            currentOrderId = inputVal;
            document.getElementById('input-container').style.display = 'none';
            document.getElementById('pay-btn').style.display = 'none';
            document.getElementById('qr-container').style.display = 'block';
            document.getElementById('status').innerText = "AWAITING PAYMENT";
            document.getElementById('qr-code').innerHTML = "";

            new QRCode(document.getElementById("qr-code"), {
                text: "https://pay.breadfast.com/dod?order=" + currentOrderId + "&amount=245.00",
                width: 150,
                height: 150,
                colorDark: "#000000",
                colorLight: "#ffffff"
            });

            startTracking();

            setTimeout(() => {
                fetch('/api/simulate-payment/' + currentOrderId, { method: 'POST' });
            }, 3000);
        }

        function startTracking() {
            trackingInterval = setInterval(() => {
                fetch('/api/order/' + currentOrderId)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'PAID') {
                        const badge = document.getElementById('status');
                        badge.innerText = "PAYMENT SUCCESSFUL ✓";
                        badge.className = "status-text status-paid";
                        document.getElementById('qr-container').style.display = 'none';
                        document.getElementById('reset-btn').style.display = 'inline-block';
                        clearInterval(trackingInterval);
                    }
                });
            }, 1000);
        }

        function resetTerminal() {
            clearInterval(trackingInterval);
            document.getElementById('input-container').style.display = 'block';
            document.getElementById('pay-btn').style.display = 'flex';
            document.getElementById('qr-container').style.display = 'none';
            document.getElementById('reset-btn').style.display = 'none';
            document.getElementById('status').innerText = "ENTER ORDER # & GENERATE";
            document.getElementById('status').className = "status-text";
            document.getElementById('order-id-input').value = "";
        }
    </script>
</body>
</html>
