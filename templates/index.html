<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>PayDOD</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <meta property="og:image" content="{{ url_for('static', filename='logo.png') }}">
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; padding: 20px; background-color: #0f172a; color: #f8fafc; }
        h1 { color: #38bdf8; }
        h2 { color: #c084fc; }
        table { margin: 20px auto; border-collapse: collapse; width: 85%; background: #1e293b; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-radius: 8px; overflow: hidden; }
        th, td { border: 1px solid #334155; padding: 12px; text-align: center; }
        th { background-color: #2563eb; color: white; }
        td { color: #e2e8f0; }
    </style>
</head>
<body>
    <h1>مرحباً بك في نظام PayDOD للأتمتة</h1>
    <h2>قائمة الأوردرات الحالية:</h2>
    <table id="orders-table">
        <tr>
            <th>ID</th>
            <th>المبلغ</th>
            <th>الحالة</th>
        </tr>
        {% for order in orders %}
        <tr id="row-{{ order[0] }}">
            <td>{{ order[0] }}</td>
            <td>{{ order[1] }}</td>
            <td class="status-cell" id="status-{{ order[0] }}">{{ order[2] }}</td>
        </tr>
        {% endfor %}
    </table>
    <script>
        setInterval(function() {
            fetch('/api/orders')
                .then(response => response.json())
                .then(data => {
                    data.orders.forEach(order => {
                        let statusCell = document.getElementById('status-' + order[0]);
                        if (statusCell) { statusCell.innerText = order[2]; }
                    });
                });
        }, 4000);
    </script>
</body>
</html>
